name: Daily Price Tracker

on:
  schedule:
    - cron: '55 09 * * *'
      timezone: 'America/Toronto'
    - cron: '55 17 * * *'
      timezone: 'America/Toronto'
  workflow_dispatch:
  # push:
  #   branches:
  #     - main

jobs:
  track-prices:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run price tracker
        id: playwright
        continue-on-error: true
        env:
          GOOGLE_SHEETS_WEB_APP_URL: ${{ secrets.GOOGLE_SHEETS_WEB_APP_URL }}
          PRICE_TRACKER_SECRET: ${{ secrets.PRICE_TRACKER_SECRET }}
        run: npx playwright test --project=webkit --reporter=line,html

      - name: Record Playwright result
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.playwright.outcome }}
        run: |
          echo "## Price Tracker Run Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ "$TEST_OUTCOME" = "success" ]; then
            echo "### ✅ Playwright tests passed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ❌ Playwright tests failed" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Test outcome:** $TEST_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Browser:** WebKit" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Test report:** See the uploaded Playwright artifacts below." >> "$GITHUB_STEP_SUMMARY"

          if [ "$TEST_OUTCOME" != "success" ]; then
            exit 1
          fi

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-test-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
