
name: Daily Price Tracker

on:
  schedule:
    - cron: '55 09 * * *'
      timezone: 'America/Toronto'
    - cron: '55 17 * * *'
      timezone: 'America/Toronto'
  workflow_dispatch:
  # push:
  #   branches:
  #     - main

jobs:
  track-prices:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run price tracker
        run: npx playwright test --project=webkit
        env:
          GOOGLE_SHEETS_WEB_APP_URL: ${{ secrets.GOOGLE_SHEETS_WEB_APP_URL }}
          PRICE_TRACKER_SECRET: ${{ secrets.PRICE_TRACKER_SECRET }}
